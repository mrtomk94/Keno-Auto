# KenoAuto on GitHub: runs every 30 minutes on GitHub's servers — your PC can stay off.
# Data lives on the "data" branch (keno.db + one CSV per day). The report is published to GitHub Pages.
name: KenoAuto

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # every 30 min (GitHub may start it a few minutes late — backfill covers that)
  workflow_dispatch:          # "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: keno
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/Los_Angeles
      KENO_BROWSER_CHANNEL: ""
    steps:
      - uses: actions/checkout@v4

      - name: Restore saved data from the data branch
        id: restore
        run: |
          mkdir -p state data reports
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C state
            test -f state/keno.db || { echo "data branch exists but keno.db is missing — stopping so nothing is overwritten"; exit 1; }
            cp state/keno.db data/keno.db
            [ -d state/draws ] && cp -r state/draws data/draws
            [ -d state/reports ] && cp state/reports/report-*.html reports/ 2>/dev/null || true
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "first run — starting a new database"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
          python3 -c "import sqlite3,os;p='data/keno.db';print(sqlite3.connect(p).execute('select count(*) from draws').fetchone()[0] if os.path.exists(p) else 0)" > before.txt
          echo "draws before: $(cat before.txt)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Import old tracker history (first run only)
        if: steps.restore.outputs.fresh == 'true'
        run: python keno_auto.py --import old/keno-report-2026-09-16-20-45.json

      - name: Fetch draws, score engines, build report
        id: run
        continue-on-error: true
        run: python keno_auto.py --once

      - name: Save data to the data branch
        run: |
          after=$(python3 -c "import sqlite3;print(sqlite3.connect('data/keno.db').execute('select count(*) from draws').fetchone()[0])")
          before=$(cat before.txt)
          echo "draws before: $before  after: $after"
          if [ "$after" -lt "$before" ]; then echo "database shrank — refusing to save"; exit 1; fi
          rm -rf site && mkdir -p site/reports
          cp reports/latest.html site/index.html
          cp reports/*.html site/reports/ 2>/dev/null || true
          cp reports/summary.json data/keno.db data/status.json site/ 2>/dev/null || true
          [ -d data/draws ] && cp -r data/draws site/draws
          [ -d logs ] && cp -r logs site/logs
          [ -d debug ] && cp -r debug site/debug
          touch site/.nojekyll
          cd site
          git init -q -b data
          git add -A
          git -c user.name="keno-bot" -c user.email="keno-bot@users.noreply.github.com" commit -q -m "data $(date '+%Y-%m-%d %H:%M %Z') · $after draws"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Keep the schedule alive (GitHub pauses schedules after 60 days without commits)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date > .keepalive
            git add .keepalive
            git -c user.name="keno-bot" -c user.email="keno-bot@users.noreply.github.com" commit -q -m "keepalive"
            git push -q
          fi

      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Fail the run if fetching failed (so you get an email)
        if: steps.run.outcome == 'failure'
        run: exit 1
